server {
    listen   8080;
    server_name  localhost;
    root /srv;
    server_tokens off;

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_format html;
        autoindex_localtime on;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.(mp3|wav|tr) {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
