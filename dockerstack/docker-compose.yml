services:
  # One-shot job: the app and pipeline images run as non-root UID 105 / GID 106 (the same owner
  # the ftp service gives uploaded content). Volumes created when these containers ran as root
  # are root-owned, so hand them over before the app and pipeline start.
  volume-permissions:
    image: bibletranslationtools/fetcher-pipeline:${FETCHER_IMAGE_TAG}
    user: "0:0"
    entrypoint: ["chown", "-R", "105:106", "/content", "/rc", "/repos"]
    volumes:
      - fetcher-content:/content
      - fetcher-rc:/rc
      - fetcher-repos:/repos
    restart: "no"
  fileserver:
    build: ./fileserver
    ports:
      - "8081:8080"
    volumes:
      - fetcher-content:/srv/content:ro
      - fetcher-rc:/srv/rc:ro
    restart: unless-stopped
  fetcher-app:
    # for local development, tag your image with "local" e.g. `docker build -t bibletranslationtools/fetcher:local .`
    image: bibletranslationtools/fetcher:${FETCHER_IMAGE_TAG}
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      CDN_BASE_URL: ${CDN_BASE_URL}
      CDN_BASE_RC_URL: ${CDN_BASE_RC_URL}
      RC_TEMP_DIR: ${RC_TEMP_DIR}
      CACHE_REFRESH_MINUTES: ${CACHE_REFRESH_MINUTES}
      LANGUAGE_REFRESH_MINUTES: ${LANGUAGE_REFRESH_MINUTES}
    volumes:
      - fetcher-content:/content
      - fetcher-rc:${RC_TEMP_DIR}
      - fetcher-repos:${ORATURE_REPO_DIR}
    restart: unless-stopped
  ftp:
    image: bogem/ftp
    volumes:
      - fetcher-content:/home/vsftpd
    ports:
      - "20:20"
      - "21:21"
      - "47400-47470:47400-47470"
    environment:
      FTP_USER: ${fetcher_ftp_user}
      FTP_PASS: ${fetcher_ftp_pass}
      PASV_ADDRESS: ${fetcher_ftp_ip}
    restart: always
  pipeline:
    image: bibletranslationtools/fetcher-pipeline:${FETCHER_IMAGE_TAG}
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SENTRY_DSN: ${SENTRY_DSN}
      RC_TEMP_DIR: ${RC_TEMP_DIR}
      ORATURE_REPO_DIR: ${ORATURE_REPO_DIR}
      CDN_BASE_URL: ${CDN_BASE_URL}
      SERVICE_BUS_TOPIC_NAME: ${SERVICE_BUS_TOPIC_NAME}
      SERVICE_BUS_CONNECTION_STRING: ${SERVICE_BUS_CONNECTION_STRING}
      QUEUE_EXCLUDE_ARGS: ${QUEUE_EXCLUDE_ARGS}
      ADDITIONAL_PARAMS_PIPELINE: ${ADDITIONAL_PARAMS_PIPELINE}
    volumes:
      - fetcher-content:/content
      - fetcher-rc:${RC_TEMP_DIR}
      - fetcher-repos:${ORATURE_REPO_DIR}

volumes:
  fetcher-content:
  fetcher-rc:
  fetcher-repos:
