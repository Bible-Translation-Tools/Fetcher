version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /fetcher-web
      - /fetcher-pipeline
      - /dockerstack/fileserver
    target-branch: audiobieldev.walink.org
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /fetcher-pipeline
    target-branch: audiobieldev.walink.org
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /fetcher-web
    target-branch: audiobieldev.walink.org
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: audiobieldev.walink.org
    schedule:
      interval: weekly
