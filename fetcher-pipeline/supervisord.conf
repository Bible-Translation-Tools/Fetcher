; Process manager for the three pipeline services (replaces pm2).
; Commands run through bash so the ${...} env vars from compose are expanded at start time.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/home/app/supervisord.pid

[program:fetcher-pipeline]
command=bash -c 'exec python app.py -i /content ${ADDITIONAL_PARAMS_PIPELINE} -hr "${PIPELINE_FREQUENCY_HOUR}" -mn "${PIPELINE_FREQUENCY_MINUTE}" --queue_exclude ${QUEUE_EXCLUDE_ARGS}'
directory=/fetcher-pipeline
autorestart=unexpected
exitcodes=0
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:directory-cleaner]
command=bash -c 'exec python directorycleaner.py ${ADDITIONAL_PARAMS_DIRECTORY_CLEANER} -hr "${DIR_CLEANUP_FREQUENCY_HOUR}" -mn "${DIR_CLEANUP_FREQUENCY_MINUTE}"'
directory=/fetcher-pipeline
autorestart=unexpected
exitcodes=0
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:update-rc-repository]
command=bash -c 'exec python update_repo.py ${ADDITIONAL_PARAMS_UPDATE_REPO} -hr "${UPDATE_REPO_FREQUENCY_HOUR}" -mn "${UPDATE_REPO_FREQUENCY_MINUTE}"'
directory=/fetcher-pipeline
autorestart=unexpected
exitcodes=0
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
